# /etc/idle-check.conf — settings for idle-check.sh (installed from
# ai-coding-setup/idle-shutdown). Sourced by bash: no spaces around '='.

# 1 = log the decision only, never power off. Start here, flip to 0 later.
DRY_RUN=0     # 0 = power off when the rule is met. 1 = log only, never power off

# Minutes without activity before powering off.
IDLE_MIN=60   # no session at all: no pig process, no open SSH connection
OPEN_MIN=120  # a session is still open (pig TUI, SSH shell) but nobody is using it

# Seconds to warn logged-in users and re-check before powering off.
GRACE_SEC=60

# Trial runs (idle-ctl test) override the tiers above from /run/idle-shutdown-test, which
# expires on its own and is cleared by a reboot. Nothing here needs changing for that.

# The SSH port: an open shell counts as a session. An SSH session buys the
# OPEN_MIN tier but does not reset the clock: shell work is not observable here.
SSH_PORT=22           # empty = ignore SSH sessions
PI_PROC_NAME=pig

# Target user. Empty = auto-detect (root: the first user with ~/.pig or ~/.pi, else $USER).
PI_USER=
PI_HOME=
# Colon-separated. Default: $PI_HOME/.pig/agent/sessions:$PI_HOME/.pi/agent/sessions
# (host PiG writes the first, sandboxed PiG -- pi-sandbox, Paseo -- the second).
PI_SESSIONS_DIR=
OMNI_DB=              # default: $PI_HOME/.omniroute/storage.sqlite
# What counts as a real client request: comma-separated literal path prefixes.
# Default-deny, so housekeeping endpoints OmniRoute adds later stay ignored.
# call_logs also records connection health tests (hourly, /api/providers/test) and
# model syncs; counting those means the clock never reaches the threshold.
# Widen with a prefix, e.g. OMNI_ALLOW_PATHS=/v1/  ; empty = count every row.
OMNI_ALLOW_PATHS=/v1/messages,/v1/responses,/v1/chat/completions
# Known housekeeping, skipped silently. Any other skipped path is logged to the
# journal, so an endpoint missing from the allowlist is visible rather than silent.
OMNI_INTERNAL_PATHS=/api/

HOLD_FILE=/run/idle-shutdown-hold
